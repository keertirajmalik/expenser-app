name: PR check

on:
  pull_request:
    branches: [main]

# A fresh push makes the in-flight run pointless; don't pay for it.
concurrency:
  group: pr-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history, so the schema check can compare against the base branch.
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      # Debug build only: this job exists to catch a dependency bump that
      # breaks the build, so it needs no keystore and publishes no APK.
      - name: Build debug APK
        run: ./gradlew assembleDebug

      # The build re-exports the Room schema. Fail if it differs from the commit (entity
      # changed, nothing committed) or if the PR edits a schema version main already has
      # (entity changed and the rewritten file committed, version not bumped).
      - name: Room schema matches the committed one
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          msg="Bump the version in ExpenserDatabase, add a Migration to ExpenserDatabase.MIGRATIONS, and commit the new app/schemas/.../<version>.json. Never edit an existing <version>.json: installed apps already have that schema."
          uncommitted=$(git status --porcelain -- app/schemas)
          if [ -n "$uncommitted" ]; then
            echo "::error::The Room schema changed but app/schemas doesn't match it. $msg"
            echo "$uncommitted"
            git diff -- app/schemas | head -80 || true
            exit 1
          fi
          edited=$(git diff --name-only --diff-filter=MD "origin/$BASE_REF"...HEAD -- app/schemas)
          if [ -n "$edited" ]; then
            echo "::error::This PR edits a Room schema version that $BASE_REF already has. $msg"
            echo "$edited"
            exit 1
          fi

      # Separate step so a compile failure and a test failure are told apart
      # at a glance in the checks UI.
      - name: Unit tests
        run: ./gradlew testDebugUnitTest
